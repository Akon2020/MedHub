# Development PostgreSQL for machines with Docker. Without Docker, use a local PostgreSQL (see guide.md).
services:
  postgres:
    image: postgres:16-alpine
    container_name: medhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    ports:
      - '5432:5432'
    volumes:
      - medhub-pg:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  medhub-pg:
